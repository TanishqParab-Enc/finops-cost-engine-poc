# Stack registry for the central FinOps pipeline.
#
# This file is the ONLY source of Terraform directories, deployability and
# state keys. Nothing here may be supplied by a pull request input: the gate
# resolves a stack by name against this registry, and the trusted main run
# re-reads it from trusted code before any deployment.
#
# deployable=false means the stack is priced and reported but can never be
# applied, and a PASS must not mint a deployment cost lock for it.
schema_version: "1.0"

stacks:
  aws:
    terraform_dir: terraform/aws
    cloud: aws
    deployable: true
    environment: dev
    state_key: finops-poc/dev/aws/terraform.tfstate
    var_file: environments/dev.tfvars
    paths:
      - terraform/aws/

  web-platform:
    terraform_dir: terraform/workloads/web-platform
    cloud: aws
    # The Dev deploy role's inline policy (finops-poc-dev-deploy-write) was
    # widened to cover RDS, ELB, CloudFront, Route 53, Auto Scaling,
    # CloudWatch Logs, VPC networking and the workload's own IAM
    # role/instance-profile/asset bucket - applied 2026-09-08. An APPROVED
    # BLOCK may now reach Terraform apply for this stack.
    deployable: true
    environment: dev
    # Already covered by the project-wide finops-poc/* state permission, so no
    # IAM change is needed for this path.
    state_key: finops-poc/dev/web-platform/terraform.tfstate
    var_file: null
    # S3, CloudFront and CloudWatch bill on consumption, so Terraform alone
    # cannot price them. Passed to Infracost 0.10.45 as --usage-file; without
    # it those resources price at zero and the breakdown understates the bill.
    usage_file: terraform/workloads/web-platform/infracost-usage.yml
    paths:
      - terraform/workloads/web-platform/

  # A second, entirely independent workload sharing the same governance engine.
  # Nothing about the gate, the policy, the approval path or the reporting is
  # specific to either stack - registering a Terraform root here is all it
  # takes to bring it under FinOps control.
  ecommerce-platform:
    terraform_dir: terraform/workloads/ecommerce-platform
    cloud: aws
    # The Dev deploy role was widened for the three services this workload
    # introduces and web-platform does not use - ElastiCache, SQS and its own
    # Secrets Manager entry - each scoped by name to shopfront-*, plus RDS
    # parameter groups and Auto Scaling policies. See
    # backend/environments/dev/terraform.tfvars.
    #
    # PREREQUISITE: that policy change must be applied to the backend layer
    # before a deploy here can succeed. Cost estimation, gating and reporting
    # work regardless.
    deployable: true
    environment: dev
    # Its own state object, independent of web-platform. Already covered by the
    # project-wide finops-poc/* state permission, so no IAM change is needed.
    state_key: finops-poc/dev/ecommerce-platform/terraform.tfstate
    var_file: null
    # S3, CloudFront, SQS and CloudWatch bill on consumption, so Terraform
    # alone cannot price them.
    usage_file: terraform/workloads/ecommerce-platform/infracost-usage.yml
    paths:
      - terraform/workloads/ecommerce-platform/

  # -------------------------------------------------------------------------
  # Multi-cloud (2026-09-18). Azure and GCP reuse the SAME governance engine,
  # the SAME threshold and the SAME S3 state bucket as AWS - only the key
  # prefix, the deployment credentials and the Terraform provider differ.
  #
  # Their state_key MUST be finops-poc/<environment>/<cloud>/<workload>/
  # terraform.tfstate. src/finops/stacks.py enforces that shape for azure/gcp
  # so a run can never initialise against an AWS workload's state. The AWS
  # entries above predate this convention and are deliberately exempt.
  #
  # subscription_id / project_id are non-secret identifiers. Credentials are
  # never stored in this registry.
  # -------------------------------------------------------------------------
  azure-sandbox:
    terraform_dir: terraform/workloads/azure/sandbox
    cloud: azure
    deployable: true
    environment: dev
    state_key: finops-poc/dev/azure/sandbox/terraform.tfstate
    var_file: null
    subscription_id: ce847125-30f1-42d7-830f-3f74c0e681ed
    location: eastus
    # Pre-existing and shared with unrelated workloads: read, never created,
    # never destroyed. Everything this stack owns starts with name_prefix.
    resource_group: Azure-AI-Tagging-POC
    name_prefix: azsandbox-dev
    # Blob storage bills on consumption, so Terraform alone cannot price it.
    usage_file: terraform/workloads/azure/sandbox/infracost-usage.yml
    paths:
      - terraform/workloads/azure/sandbox/

  gcp-sandbox:
    terraform_dir: terraform/workloads/gcp/sandbox
    cloud: gcp
    deployable: true
    environment: dev
    state_key: finops-poc/dev/gcp/sandbox/terraform.tfstate
    var_file: null
    project_id: ai-tagging-poc
    region: us-central1
    zone: us-central1-a
    # Pre-existing and shared with unrelated workloads: this stack owns only
    # what starts with name_prefix, and destroy is bounded to that.
    name_prefix: gcpsandbox-dev
    # Cloud Storage bills on consumption, so Terraform alone cannot price it.
    usage_file: terraform/workloads/gcp/sandbox/infracost-usage.yml
    paths:
      - terraform/workloads/gcp/sandbox/
