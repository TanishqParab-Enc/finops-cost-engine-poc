# Infracost usage assumptions for the GCP sandbox.
#
# THESE ARE TEST ASSUMPTIONS, NOT MEASURED PRODUCTION FIGURES. They exist so
# consumption-priced resources contribute a non-zero, explainable number rather
# than silently pricing at $0. Terraform alone cannot know these values.

version: 0.1

resource_usage:
  google_storage_bucket.assets:
    # ASSUMPTION: a few GiB of objects and light request traffic.
    storage_gb: 5
    monthly_class_a_operations: 10000
    monthly_class_b_operations: 50000
    monthly_data_retrieval_gb: 2
    monthly_egress_data_transfer_gb:
      same_continent: 1
