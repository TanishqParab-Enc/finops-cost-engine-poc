# Infracost usage assumptions for the Azure sandbox.
#
# THESE ARE TEST ASSUMPTIONS, NOT MEASURED PRODUCTION FIGURES. They exist so
# consumption-priced resources contribute a non-zero, explainable number rather
# than silently pricing at $0. Terraform alone cannot know these values.
#
# Deliberately small, matching a sandbox that is created and destroyed within
# a validation run.

version: 0.1

resource_usage:
  azurerm_storage_account.assets:
    # ASSUMPTION: a few GiB of blobs and light request traffic.
    storage_gb: 5
    monthly_write_operations: 10000
    monthly_read_operations: 50000
    monthly_list_and_create_container_operations: 100
    monthly_other_operations: 1000
    monthly_data_retrieval_gb: 2
    monthly_data_write_gb: 2
