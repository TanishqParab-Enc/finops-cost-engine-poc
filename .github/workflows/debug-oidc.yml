name: Debug OIDC claims

# Temporary diagnostic. Prints the OIDC subject GitHub actually sends so the
# IAM trust policy can be matched against reality. Delete once resolved.

"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-oidc.yml'

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    name: Show OIDC claims
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OIDC token
        run: |
          curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" > token.json

      - name: Decode claims
        run: |
          python3 -c "
          import base64, json
          tok = json.load(open('token.json'))['value']
          part = tok.split('.')[1]
          part += '=' * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          for key in ('sub','aud','repository','repository_id','repository_owner','repository_owner_id','ref','event_name','environment'):
              print('{:22}: {}'.format(key, claims.get(key)))
          "
