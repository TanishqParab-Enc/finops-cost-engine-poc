name: Debug OIDC claims

# Temporary diagnostic. Prints the OIDC subject GitHub actually sends so the
# IAM trust policy can be matched against reality. Delete once resolved.

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    name: Show OIDC claims
    runs-on: ubuntu-latest
    steps:
      - name: Decode OIDC token claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64, then pad
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="$PAYLOAD==" ;;
            3) PAYLOAD="$PAYLOAD=" ;;
          esac

          echo "$PAYLOAD" | base64 -d 2>/dev/null \
            | python3 -c "
import sys, json
c = json.load(sys.stdin)
print('sub        :', c.get('sub'))
print('aud        :', c.get('aud'))
print('repository :', c.get('repository'))
print('ref        :', c.get('ref'))
print('event_name :', c.get('event_name'))
print('environment:', c.get('environment'))
print('iss        :', c.get('iss'))
"
