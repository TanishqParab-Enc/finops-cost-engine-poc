name: FinOps Cost Gate

# Shift-left FinOps control, entirely within ONE pipeline execution:
#   detect IaC change -> terraform plan (base + head) -> Infracost -> threshold
#   -> PASS (lock cost, deploy automatically)
#   -> BLOCK (pause for human review via a GitHub Actions Environment,
#      required-reviewer approval resumes the SAME run, reject stops it)
#   -> deploy using the plan already produced by this run (never re-planned,
#      never re-priced)

# Quoted because YAML 1.1 resolves a bare `on` key to boolean true.
"on":
  pull_request:
    paths:
      - 'terraform/**'
      - 'config/finops-policy.yaml'
      - 'config/finops-stacks.yml'
      - 'finops-exceptions/**'
      - '.github/workflows/finops-cost-gate.yml'
  # Manual trigger for the read-only scenario-pricing job only. Deploy is
  # reachable only from a pull_request run (see the `deploy` job).
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required for AWS OIDC

env:
  PYTHON_VERSION: '3.12'
  TERRAFORM_VERSION: '1.11.0'
  AWS_REGION: us-east-1
  # Recorded as the approving identity on an exception record. The real
  # authorisation check is GitHub's own required-reviewers rule on the
  # `finops-cost-approval` Environment (see the `finops-approval` job) - this
  # value is descriptive/audit only, never a security boundary by itself.
  FINOPS_APPROVER: ${{ vars.FINOPS_APPROVER || 'TanishqParab-Enc' }}

jobs:
  detect-changes:
    name: Detect infrastructure changes
    runs-on: ubuntu-latest
    outputs:
      has_infra_changes: ${{ steps.detect.outputs.has_infra_changes }}
      stacks: ${{ steps.detect.outputs.stacks }}
      aws_evaluated: ${{ steps.detect.outputs.aws_evaluated }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install engine
        run: pip install --quiet -e .

      - name: Detect
        id: detect
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref || github.event.repository.default_branch }}"

          finops detect-changes --base "$BASE" --head HEAD --json > changes.json
          cat changes.json

          HAS=$(python -c "import json;print(str(json.load(open('changes.json'))['has_infrastructure_changes']).lower())")
          echo "has_infra_changes=$HAS" >> "$GITHUB_OUTPUT"

          # Stacks come from config/finops-stacks.yml - repository data, never a
          # workflow input - so a pull request cannot point the gate at an
          # arbitrary Terraform directory or mark itself deployable.
          STACKS=$(python - <<'PY'
          import json
          from finops.stacks import select_stacks
          files = json.load(open('changes.json'))['infrastructure_files']
          # No fallback. A change that maps to no stack must evaluate nothing:
          # defaulting to aws priced an untouched stack and minted a real cost
          # lock for it, which is a deployment authorisation nobody asked for.
          print(json.dumps([
              {"name": s.name, "dir": s.terraform_dir, "cloud": s.cloud,
               "deployable": s.deployable, "environment": s.environment,
               "usage_file": s.usage_file or ""}
              for s in select_stacks(files)
          ]))
          PY
          )
          echo "stacks=$STACKS" >> "$GITHUB_OUTPUT"
          echo "Selected stacks: $STACKS"

          # Deployment is AWS-only in this POC, and only for stacks the registry
          # marks deployable. Without this the deploy job could apply after a
          # push that never priced the aws stack.
          AWS_EVAL=$(STACKS="$STACKS" python -c "import json,os;print('true' if any(s['name']=='aws' for s in json.loads(os.environ['STACKS'])) else 'false')")
          echo "aws_evaluated=$AWS_EVAL" >> "$GITHUB_OUTPUT"
          echo "AWS stack evaluated by the gate: $AWS_EVAL"

  cost-gate:
    name: Cost gate (${{ matrix.stack.name }})
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.stacks != '' &&
      needs.detect-changes.outputs.stacks != '[]' &&
      needs.detect-changes.outputs.has_infra_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect-changes.outputs.stacks) }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          # Pinned - both the runner and parser are verified against this
          # exact version. Do not float; an untested minor/major bump could
          # silently change command syntax or output schema.
          version: "0.10.45"

      - name: Install engine
        working-directory: head
        run: pip install --quiet -e '.[bedrock]'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Both plans use the committed terraform.tfvars, which Terraform loads
      # automatically. The cost difference therefore comes purely from what the
      # pull request changed.
      #
      # The cost gate must never read, write or lock any live workload state
      # (dev's or prod's). `init -backend=false` cannot achieve that: it
      # records no backend at all, so the following `plan` re-reads the
      # `backend "s3"` block in main.tf and fails with "Backend
      # initialization required" (reproduced in CI and a clean checkout).
      #
      # Instead each step writes a local-backend override into its own
      # throwaway base/ or head/ checkout. Terraform then plans against an
      # ephemeral local state: no S3 call, no .tflock, no live state access.
      # Infracost prices the plan's *planned end state*, so pricing stays
      # correct and reproducible from empty state every run.
      #
      # This file is generated at runtime and never committed. It must NOT be
      # copied into the deploy job - a `backend "local"` block there makes
      # every S3 -backend-config argument invalid and breaks deployment.
      # A stack that does not exist on the base ref is an initial deployment,
      # not a change to an existing one - its baseline cost is $0, not "same
      # as proposed". Determined by directory existence, independent of
      # whether a plan would succeed, so a real Terraform error is never
      # mistaken for "new stack" (and vice versa).
      - name: Detect initial deployment
        id: initial
        run: |
          set -euo pipefail
          if [ -d "base/${{ matrix.stack.dir }}" ]; then
            echo "is_initial=false" >> "$GITHUB_OUTPUT"
            echo "Stack '${{ matrix.stack.name }}' exists on the base ref; treating as an existing-stack change."
          else
            echo "is_initial=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Initial deployment::Stack '${{ matrix.stack.name }}' does not exist on the base ref (${{ github.base_ref || github.event.repository.default_branch }}). Baseline cost is \$0; the full projected cost is the incremental cost."
          fi

      - name: Terraform plan (base branch = baseline cost)
        id: baseline
        if: steps.initial.outputs.is_initial != 'true'
        continue-on-error: true
        working-directory: base/${{ matrix.stack.dir }}
        run: |
          set -euo pipefail
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > "$GITHUB_WORKSPACE/baseline-plan.json"

      - name: Terraform plan (PR head = proposed cost)
        working-directory: head/${{ matrix.stack.dir }}
        run: |
          set -euo pipefail
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > "$GITHUB_WORKSPACE/proposed-plan.json"

      # The gate prices the auto-loaded terraform.tfvars, but a dev deploy
      # applies environments/dev.tfvars on top of it. Nothing otherwise forces
      # those to agree, so the pipeline could approve one configuration and
      # ship another. Both plans here are hermetic (empty local state), so the
      # comparison is state-independent; the stateful deploy plan is
      # deliberately NOT used, because its create/update actions legitimately
      # differ once dev already exists.
      #
      # The resolved `variables` block is authoritative. A resource-level
      # fingerprint cannot see provider region: main.tf sets `region =
      # var.region`, so the plan records a reference rather than a
      # constant_value and the normalizer resolves region to null on both
      # sides - a us-east-1 vs eu-west-1 swap produced byte-identical
      # fingerprints when measured. The fingerprint is kept as a second,
      # narrower check on the resources themselves.
      - name: Assert cost-gated config matches the Dev deploy config
        if: matrix.stack.name == 'aws'
        working-directory: head/terraform/aws
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -refresh=false \
            -var-file=environments/dev.tfvars -out=devcfg.tfplan
          terraform show -json devcfg.tfplan > "$GITHUB_WORKSPACE/dev-config-plan.json"
          python - <<'PY'
          import json
          import os
          import sys
          from finops.plan.normalizer import normalize_plan_file

          REQUIRED = (
              "region", "ami_id", "instance_type", "instance_count",
              "root_volume_size_gb", "data_volume_size_gb", "data_volume_count",
              "enable_nat_gateway", "environment", "service",
          )
          ABSENT = object()
          ws = os.environ["GITHUB_WORKSPACE"]
          failed = False

          def resolved_vars(path):
              with open(path, encoding="utf-8") as fh:
                  block = json.load(fh).get("variables")
              if not block:
                  print("::error title=Configuration drift::" + path
                        + " exposes no resolved variables; cannot prove the gated config matches Dev.")
                  sys.exit(1)
              return {name: item.get("value") for name, item in block.items()}

          gated = resolved_vars(ws + "/proposed-plan.json")
          deployed = resolved_vars(ws + "/dev-config-plan.json")

          missing = sorted(n for n in REQUIRED if n not in gated or n not in deployed)
          if missing:
              print("::error title=Configuration drift::Required variables absent from a plan: "
                    + ", ".join(missing))
              failed = True

          print("%-22s %-26s %-26s" % ("variable", "cost-gated", "dev deploy"))
          for name in sorted(set(gated) | set(deployed)):
              a = gated.get(name, ABSENT)
              b = deployed.get(name, ABSENT)
              fa = "<absent>" if a is ABSENT else json.dumps(a)
              fb = "<absent>" if b is ABSENT else json.dumps(b)
              drift = a is ABSENT or b is ABSENT or a != b
              print("%-22s %-26s %-26s%s" % (name, fa, fb, "  <-- DRIFT" if drift else ""))
              if drift:
                  failed = True

          gfp = normalize_plan_file(ws + "/proposed-plan.json").fingerprint()
          dfp = normalize_plan_file(ws + "/dev-config-plan.json").fingerprint()
          print("")
          print("resource fingerprint  cost-gated : " + gfp)
          print("resource fingerprint  dev deploy : " + dfp)
          if gfp != dfp:
              print("::error title=Configuration drift::Resource fingerprints differ.")
              failed = True

          if failed:
              print("::error title=Configuration drift::The configuration priced by the cost "
                    "gate is not the configuration Dev would deploy. Refusing to approve one "
                    "configuration and deploy another.")
              sys.exit(1)
          print("Cost-gated configuration matches the Dev deployment configuration.")
          PY

      - name: FinOps cost gate
        id: gate
        working-directory: head
        continue-on-error: true
        env:
          # Infracost CLI v2 reads this; v0.10 reads INFRACOST_API_KEY.
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          FINOPS_THRESHOLD_VALUE: ${{ vars.FINOPS_THRESHOLD_VALUE || '100' }}
          FINOPS_THRESHOLD_METRIC: ${{ vars.FINOPS_THRESHOLD_METRIC || 'incremental_monthly_cost' }}
          # Bedrock uses the OIDC role already assumed above - no extra key.
          FINOPS_AI_PROVIDER: bedrock
          FINOPS_BEDROCK_MODEL: ${{ vars.FINOPS_BEDROCK_MODEL || 'us.anthropic.claude-haiku-4-5-20251001-v1:0' }}
          FINOPS_BEDROCK_REGION: ${{ env.AWS_REGION }}
          # Usage assumptions for consumption-priced resources (S3, CloudFront,
          # CloudWatch). Empty for stacks that declare none.
          FINOPS_INFRACOST_USAGE_FILE: ${{ matrix.stack.usage_file && format('{0}/head/{1}', github.workspace, matrix.stack.usage_file) || '' }}
        run: |
          set +e
          BASELINE_ARG=""
          if [ -f "$GITHUB_WORKSPACE/baseline-plan.json" ]; then
            BASELINE_ARG="--baseline-plan $GITHUB_WORKSPACE/baseline-plan.json"
          elif [ "${{ steps.initial.outputs.is_initial }}" = "true" ]; then
            echo "::notice::Initial deployment for '${{ matrix.stack.name }}' - current monthly cost is \$0.00; the full projected cost is the incremental cost."
          else
            echo "::warning::No baseline plan; incremental cost equals full projected cost."
          fi

          # A cost lock authorises deployment. A stack the registry marks
          # non-deployable must never mint one, however cheap it prices.
          LOCK_ARG=""
          if [ "${{ matrix.stack.deployable }}" != "true" ]; then
            LOCK_ARG="--no-cost-lock"
            echo "::notice title=Validation only::Stack '${{ matrix.stack.name }}' is not deployable; no cost lock will be created."
          fi

          finops analyze \
            --plan "$GITHUB_WORKSPACE/proposed-plan.json" \
            $BASELINE_ARG \
            --stack "${{ matrix.stack.name }}" \
            $LOCK_ARG \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --execution-id "${{ github.run_id }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Assert no cost lock exists for a non-deployable stack
        if: always() && matrix.stack.deployable != true
        working-directory: head
        run: |
          set -euo pipefail
          if [ -f .finops/cost-lock.json ]; then
            echo "::error title=Unauthorised lock::Stack '${{ matrix.stack.name }}' is not deployable but a cost lock was produced."
            exit 1
          fi
          echo "Confirmed: no deployment authorisation was created for ${{ matrix.stack.name }}."

      # A BLOCK is always PENDING/DENIED here. The only thing that can move it
      # is an explicit APPROVE from the finops-approval job, and that is
      # re-verified from scratch on trusted main before any apply - so nothing
      # in the pull request's own run can authorise a deployment.

      # The approval request itself. A BLOCK is not actionable unless the PR
      # says exactly how to approve or reject it, so append the instructions to
      # the comment the next step posts.
      - name: Request cost approval
        if: always() && steps.gate.outputs.exit_code == '1' && github.event_name == 'pull_request'
        working-directory: head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p .finops
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Restate the figures the decision is about, from this run's own
          # artifacts. The rendered table above omits a labelled incremental
          # row, and that is the number the threshold is actually applied to.
          python3 - <<'PY' > costs.txt
          import json
          cost = json.load(open(".finops/cost-estimate.json"))
          policy = (json.load(open(".finops/gate-result.json")).get("policy") or {})
          print(cost["previous_monthly_cost"], cost["new_monthly_cost"],
                cost["incremental_monthly_cost"], cost.get("currency", "USD"),
                policy.get("threshold_value"))
          PY
          read -r CUR PROJ INC CCY THRESH < costs.txt

          cat >> .finops/pr-comment.md <<EOF

          ---

          ### Cost approval required

          | | |
          |---|---|
          | Current monthly cost | $CCY $CUR |
          | Projected monthly cost | $CCY $PROJ |
          | **Incremental monthly cost** | **$CCY $INC** |
          | Threshold | $CCY $THRESH |

          \`\`\`
          finops_decision          = BLOCK
          approval_status          = PENDING
          deployment_authorization = DENIED
          \`\`\`

          **1.** This change is **BLOCKED**: the incremental monthly cost exceeds the
          threshold.
          **2.** This pull request's own pipeline run is now waiting on the
          **\`finops-cost-approval\`** GitHub Environment - it needs an explicit
          **Approve** or **Reject** from \`$FINOPS_APPROVER\`. Nothing deploys until then.

          > This is the SAME run, paused mid-execution (like a Jenkins \`input\` step) -
          > it does not re-plan or re-price anything. It consumes exactly the plan and
          > estimate this run already produced for PR #$PR_NUMBER at this exact commit.

          To decide:

          **3.** Open **[this run]($RUN_URL)**.
          **4.** Find the **\`Manual cost approval (finops-cost-approval)\`** job - it will
          show **Waiting**.
          **5.** Click **Review deployments**, select the job, and choose **Approve** or
          **Reject**.

          Approving does **not** turn this into a PASS - \`finops_decision\` stays
          \`BLOCK\`. It only sets \`deployment_authorization = AUTHORIZED\`, bound to
          PR #$PR_NUMBER at this exact commit. Any new commit invalidates it and starts
          a fresh run.
          EOF
          echo "Approval request appended to the pull request comment."

      - name: Publish gate summary
        if: always()
        working-directory: head
        run: |
          if [ -f .finops/pr-comment.md ]; then
            cat .finops/pr-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'head/.finops/pr-comment.md';
            if (!fs.existsSync(path)) return;

            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- finops-cost-gate -->';
            const tag = `${marker}\n<!-- stack:${{ matrix.stack.name }} -->`;
            const scoped = body.replace(marker, tag);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(`<!-- stack:${{ matrix.stack.name }} -->`));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: scoped,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: scoped,
              });
            }

      # Proves the lock this run just minted is untampered and still bound to
      # the current threshold and plan before anything downstream may deploy
      # it. Runs on every PASS for a deployable stack - the plan and lock were
      # both just produced by this same run, so this is a same-run integrity
      # check, not a re-verification of an earlier run's output.
      - name: Verify cost lock before deployment
        id: verify_lock
        if: steps.gate.outputs.exit_code == '0' && matrix.stack.deployable == true
        working-directory: head
        run: |
          set -euo pipefail
          finops verify-lock \
            --lock .finops/cost-lock.json \
            --stack "${{ matrix.stack.name }}" \
            --plan "$GITHUB_WORKSPACE/proposed-plan.json"

      # finops_decision (was this within budget), approval_status (has a human
      # decided) and deployment_authorization (may trusted main deploy it) are
      # deliberately separate signals. An approval never turns a BLOCK into a
      # PASS. Calls the same `finops authorize-deployment` CLI command the unit
      # tests exercise directly, so CI runs tested code rather than parallel
      # bash logic.
      - name: Compute deployment authorization
        id: authz
        if: always()
        working-directory: head
        run: |
          set -euo pipefail
          LOCK_FLAG=""
          if [ "${{ steps.verify_lock.outcome }}" = "failure" ]; then
            LOCK_FLAG="--lock-not-verified"
          fi

          set +e
          finops authorize-deployment \
            --exit-code "${{ steps.gate.outputs.exit_code }}" \
            $LOCK_FLAG --json > authz.json
          set -e
          cat authz.json

          mkdir -p .finops
          # Carried in the artifact so the approval job (and trusted main) can
          # re-derive the exact plan this run priced, never a cached number.
          cp "$GITHUB_WORKSPACE/proposed-plan.json" .finops/proposed-plan.json
          python3 - <<'PY'
          import json
          import os

          data = json.load(open("authz.json"))
          # A stack the trusted registry marks non-deployable can never be
          # authorized to deploy, whatever it priced - deployability is a
          # registry fact the authorize-deployment CLI does not know about.
          if "${{ matrix.stack.deployable }}" != "true":
              data["deployment_authorization"] = "DENIED"
          data["stack"] = "${{ matrix.stack.name }}"
          data["run_id"] = "${{ github.run_id }}"
          json.dump(data, open(".finops/authorization.json", "w"), indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"finops_decision={data['finops_decision']}\n")
              out.write(f"approval_status={data['approval_status']}\n")
              out.write(f"deployment_authorization={data['deployment_authorization']}\n")
          PY

      - name: Upload FinOps artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finops-gate-${{ matrix.stack.name }}-${{ github.run_id }}
          path: head/.finops/
          retention-days: 90
          # .finops is dot-prefixed, and upload-artifact@v4 skips hidden paths
          # by default, which silently discarded the whole audit trail.
          include-hidden-files: true

      # The gate is the last word: a non-zero exit stops the pipeline.
      #   1 = threshold exceeded - the finops-approval job (gated by the
      #       finops-cost-approval Environment) pauses this same run next
      #   2 = cost could not be trusted, failing safe
      - name: Enforce gate
        if: always()
        run: |
          CODE="${{ steps.gate.outputs.exit_code }}"
          echo "finops_decision=${{ steps.authz.outputs.finops_decision }}"
          echo "approval_status=${{ steps.authz.outputs.approval_status }}"
          echo "deployment_authorization=${{ steps.authz.outputs.deployment_authorization }}"
          case "$CODE" in
            0) echo "PASS - cost locked, pipeline may continue." ;;
            1)
              echo "::error::FinOps threshold exceeded (finops_decision=BLOCK, approval_status=PENDING). This run's finops-approval job will pause for review in the finops-cost-approval Environment - see the approval request on the pull request."
              exit 1
              ;;
            *) echo "::error::Cost could not be established. Failing safe (exit $CODE)."; exit 1 ;;
          esac

  # Prices every committed web-platform scenario against its own committed
  # baseline, using the same central mechanism as cost-gate (same Infracost
  # pin, same engine, same OIDC plan role). Read-only and informational: it
  # never mints a cost lock, never posts a PR comment, and several scenarios
  # are deliberately over budget, so it must never fail the pull request.
  #
  # Manual-only (workflow_dispatch), never on pull_request or push. The
  # normal web-platform PR path prices only the real committed workload -
  # scenarios are test fixtures, not part of the product flow.
  scenarios:
    name: Scenario ${{ matrix.scenario }}
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' &&
      contains(needs.detect-changes.outputs.stacks, '"web-platform"')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - 01-small-change
          - 02-ec2-scale-up
          - 03-s3-growth
          - 04-rds-scale-up
          - 05-asg-capacity
          - 06-multi-resource
          - 07-no-cost-change
          - 08-resource-removal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: "0.10.45"

      - name: Install engine
        run: pip install --quiet -e .

      # Same least-privilege plan role the cost gate uses. Never the deploy
      # role - this job cannot and must not touch live state.
      - name: Configure AWS credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan baseline and scenario
        working-directory: terraform/workloads/web-platform
        run: |
          set -euo pipefail
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -refresh=false -out=base.tfplan
          terraform show -json base.tfplan > "$GITHUB_WORKSPACE/s-baseline.json"
          terraform plan -input=false -no-color -refresh=false \
            -var-file="$GITHUB_WORKSPACE/tests/fixtures/web-platform/scenarios/${{ matrix.scenario }}.tfvars" -out=prop.tfplan
          terraform show -json prop.tfplan > "$GITHUB_WORKSPACE/s-proposed.json"

      - name: Price scenario with Infracost 0.10.45
        id: price
        continue-on-error: true
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          FINOPS_OUTPUT_DIR: ${{ github.workspace }}/scenario-${{ matrix.scenario }}
          FINOPS_AI_PROVIDER: none
          FINOPS_INFRACOST_USAGE_FILE: >-
            ${{
              matrix.scenario == '03-s3-growth'
              && format('{0}/tests/fixtures/web-platform/scenarios/03-s3-growth.usage.yml', github.workspace)
              || format('{0}/terraform/workloads/web-platform/infracost-usage.yml', github.workspace)
            }}
        run: |
          set +e
          finops analyze \
            --plan "$GITHUB_WORKSPACE/s-proposed.json" \
            --baseline-plan "$GITHUB_WORKSPACE/s-baseline.json" \
            --stack web-platform \
            --no-cost-lock \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --execution-id "${{ github.run_id }}-${{ matrix.scenario }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # This job is validation-only for a deployable=false-adjacent path (it
      # never claims to be the gate that authorises deployment). No lock may
      # ever be produced or survive here.
      - name: Assert no cost lock was created
        if: always()
        run: |
          set -euo pipefail
          LOCK="$GITHUB_WORKSPACE/scenario-${{ matrix.scenario }}/cost-lock.json"
          if [ -f "$LOCK" ]; then
            echo "::error title=Unauthorised lock::Scenario ${{ matrix.scenario }} produced a cost lock in a validation-only job."
            exit 1
          fi
          echo "Confirmed: scenario ${{ matrix.scenario }} created no deployment authorisation."

      - name: Summarise scenario decision
        if: always()
        run: |
          set -euo pipefail
          DIR="$GITHUB_WORKSPACE/scenario-${{ matrix.scenario }}"
          CODE="${{ steps.price.outputs.exit_code }}"
          case "$CODE" in
            0) VERDICT="PASS" ;;
            1) VERDICT="BLOCKED (over threshold)" ;;
            *) VERDICT="ERROR (failed closed)" ;;
          esac
          {
            echo "### ${{ matrix.scenario }} — ${VERDICT}"
            echo ""
            if [ -f "$DIR/pr-comment.md" ]; then
              sed 's|<!-- finops-cost-gate -->||' "$DIR/pr-comment.md"
            else
              echo "_No estimate produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finops-web-platform-scenario-${{ matrix.scenario }}-${{ github.run_id }}
          path: scenario-${{ matrix.scenario }}/
          retention-days: 90
          include-hidden-files: true

  # Aggregates each cost-gate matrix instance's authorization.json into one
  # list of stacks that need a human decision. A matrix job's outputs are not
  # aggregated by GitHub across instances, so this is the only way to build a
  # single JSON array for finops-approval's own matrix below.
  collect-blocked-stacks:
    name: Collect blocked stacks
    needs: [detect-changes, cost-gate]
    if: always() && github.event_name == 'pull_request' && needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      blocked_stacks: ${{ steps.collect.outputs.blocked_stacks }}
      has_blocked: ${{ steps.collect.outputs.has_blocked }}
    steps:
      - name: Download this run's cost-gate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: finops-gate-*-${{ github.run_id }}
          path: artifacts

      - name: Collect
        id: collect
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os

          blocked = []
          for path in glob.glob("artifacts/*/authorization.json"):
              with open(path, encoding="utf-8") as fh:
                  entry = json.load(fh)
              if entry.get("finops_decision") == "BLOCK":
                  blocked.append(entry["stack"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"blocked_stacks={json.dumps(sorted(blocked))}\n")
              out.write(f"has_blocked={'true' if blocked else 'false'}\n")
          print(f"Blocked stacks: {sorted(blocked)}")
          PY

  # THE APPROVAL GATE - a GitHub Actions Environment's required-reviewer
  # protection rule. The native equivalent of a Jenkins `input` step: this job
  # pauses THIS SAME run (status becomes "Waiting") the moment it requests the
  # `finops-cost-approval` Environment, and GitHub itself only starts the
  # steps below once the required reviewer (FINOPS_APPROVER) clicks Approve
  # on this exact run. A Reject prevents these steps from running at all -
  # the job's conclusion becomes failed/cancelled, so authorize-deploy below
  # never sees an authorization for that stack. There is deliberately no
  # "record a rejection" code path: GitHub's own gate IS the rejection
  # handling, and it happens before any step here can execute.
  #
  # No actor check is performed in these steps: GitHub will not run them
  # unless the Environment's required reviewer already approved, so that
  # identity check has already happened by the time this job's first step
  # starts - duplicating it here would check nothing GitHub has not already
  # enforced.
  #
  # Consumes only the artifact THIS SAME run's cost-gate job already
  # produced - never re-plans, never re-prices, never re-runs Terraform or
  # Infracost, never touches AWS.
  finops-approval:
    name: "Manual cost approval (finops-cost-approval)"
    needs: collect-blocked-stacks
    # always() is required: cost-gate legitimately fails on a BLOCK, and
    # without it GitHub's implicit default success() check (added whenever an
    # if: condition has no explicit status-check function) would see that
    # failure through the dependency graph and silently skip this job instead
    # of pausing it - exactly the bug this comment now documents finding.
    if: always() && needs.collect-blocked-stacks.outputs.has_blocked == 'true'
    runs-on: ubuntu-latest
    environment:
      name: finops-cost-approval
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.collect-blocked-stacks.outputs.blocked_stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install engine
        run: pip install --quiet -e .

      - name: Download this stack's cost evaluation (this run)
        uses: actions/download-artifact@v4
        with:
          name: finops-gate-${{ matrix.stack }}-${{ github.run_id }}
          path: evaluation

      # Terraform root comes from the trusted registry, never the artifact.
      - name: Record the approval
        id: decision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          TF_DIR=$(python3 -c "import os;from finops.stacks import get_stack;print(get_stack(os.environ['STACK']).terraform_dir)")

          mkdir -p finops-approval
          finops approve \
            --action approve \
            --result evaluation/gate-result.json \
            --plan evaluation/proposed-plan.json \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --stack "$STACK" \
            --terraform-dir "$TF_DIR" \
            --run-event "${{ github.event_name }}" \
            --approver "$FINOPS_APPROVER" \
            --out "finops-approval/${STACK}-exception.json" \
            --json | tee decision.json

          finops authorize-deployment --exit-code 1 --exception-valid --json > authz.json
          cat authz.json
          RUN_ID="${{ github.run_id }}" STACK="$STACK" python3 -c "import json,os;d=json.load(open('authz.json'));d['stack']=os.environ['STACK'];d['run_id']=os.environ['RUN_ID'];json.dump(d,open('finops-approval/authorization.json','w'),indent=2)"

      - name: Publish the decision
        if: always() && steps.decision.outcome == 'success'
        run: |
          {
            echo "## FinOps cost estimate APPROVED - ${{ matrix.stack }}"
            echo ""
            echo '```'
            echo "finops_decision          = BLOCK   (unchanged - approval never rewrites the decision)"
            echo "approval_status          = APPROVED"
            echo "deployment_authorization = AUTHORIZED"
            echo '```'
            echo ""
            echo "Approved by $FINOPS_APPROVER for PR #${{ github.event.pull_request.number }} at \`${{ github.event.pull_request.head.sha }}\`."
            echo ""
            cat decision.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the approval record
        if: always() && steps.decision.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finops-approval-${{ matrix.stack }}-${{ github.run_id }}
          path: finops-approval/
          retention-days: 90

  # Apply is NEVER reachable except from a pull_request run that has been
  # explicitly authorized in THIS SAME run - either cost-gate's own PASS/lock
  # path, or finops-approval's Environment-gated approval above.
  # `matrix.stack.deployable` is read from the SAME trusted registry JSON
  # detect-changes already built for cost-gate - a PR cannot flip it, since it
  # is never taken from workflow input. The deploy job also re-reads
  # config/finops-stacks.yml directly, so deployability is checked twice,
  # independently.
  #
  # cost-gate is matrixed by stack, so its own job conclusion is all-or-
  # nothing across every stack the PR touched: one BLOCKED stack would make
  # the whole job 'failure', which must not stop an unrelated, already-
  # authorized stack from deploying. This job aggregates each matrix
  # instance's authorization.json (from cost-gate's own artifact, and - for a
  # BLOCKed stack - finops-approval's artifact if and only if that stack's
  # approval actually ran) into one per-stack map, so `deploy` can depend on
  # an explicit authorization result instead of cost-gate's raw pass/fail.
  # Always runs (`always()`) so it aggregates the DENIED/rejected case too,
  # not just skip past it.
  authorize-deploy:
    name: Aggregate deployment authorization
    needs: [detect-changes, cost-gate, finops-approval]
    if: always() && github.event_name == 'pull_request' && needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      authorizations: ${{ steps.aggregate.outputs.authorizations }}
    steps:
      - name: Download cost-gate authorizations (this run)
        uses: actions/download-artifact@v4
        with:
          pattern: finops-gate-*-${{ github.run_id }}
          path: gate-artifacts

      - name: Download approval decisions (this run, if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: finops-approval-*-${{ github.run_id }}
          path: approval-artifacts

      - name: Aggregate per-stack authorization
        id: aggregate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os

          merged = {}
          for path in glob.glob("gate-artifacts/*/authorization.json"):
              with open(path, encoding="utf-8") as fh:
                  entry = json.load(fh)
              stack = entry.get("stack")
              if stack:
                  merged[stack] = entry

          # A BLOCKed stack's authorization is only ever overwritten here if
          # finops-approval actually produced an artifact for it - which only
          # happens when GitHub's required-reviewer gate let that job's steps
          # run at all (i.e. it was approved, never rejected).
          for path in glob.glob("approval-artifacts/*/authorization.json"):
              with open(path, encoding="utf-8") as fh:
                  entry = json.load(fh)
              stack = entry.get("stack")
              if stack:
                  merged[stack] = entry

          print("Aggregated deployment authorization:")
          print(json.dumps(merged, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"authorizations={json.dumps(merged)}\n")
          PY


  deploy:
    name: Deploy (gated) [${{ matrix.stack.name }}]
    needs: [detect-changes, authorize-deploy]
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect-changes.outputs.stacks) }}
    # The `matrix` context is only available in `strategy` and `steps`, never
    # in a job-level `if:` - so deployability (matrix.stack.deployable) cannot
    # be checked here. It is instead enforced, per matrix instance, by
    # "Verify the stack is deployable (trusted registry)" below, which fails
    # closed before any Terraform command runs. Deliberately depends on
    # authorize-deploy's explicit result, never on cost-gate's raw pass/fail
    # (see the comment on authorize-deploy).
    if: github.event_name == 'pull_request' && needs.authorize-deploy.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: dev
    env:
      # This POC's PR-triggered flow deploys to dev only. A production
      # tier would need its own Environment-gated job, not a workflow input -
      # a workflow input cannot be trusted the way an Environment gate can.
      TARGET_ENV: dev
      # Which stack this specific matrix job applies. Comes from the trusted
      # stacks JSON (registry + changed paths), never a workflow input, and is
      # re-verified against the registry file itself in the next step.
      DEPLOY_STACK: ${{ matrix.stack.name }}
    steps:
      - uses: actions/checkout@v4

      # The actual authorization gate. finops_decision stays BLOCK for an
      # over-threshold change even when deployment_authorization is
      # AUTHORIZED via an approved exception - this step never treats those
      # as interchangeable, it only acts on deployment_authorization.
      - name: Verify deployment authorization for this stack
        env:
          AUTHORIZATIONS: ${{ needs.authorize-deploy.outputs.authorizations }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          stack = "${{ matrix.stack.name }}"
          data = json.loads(os.environ.get("AUTHORIZATIONS") or "{}")
          entry = data.get(stack)
          if entry is None:
              sys.exit(
                  f"::error title=No authorization record::No deployment "
                  f"authorization was computed for stack {stack!r}. Refusing to deploy."
              )

          decision = entry.get("finops_decision")
          auth = entry.get("deployment_authorization")
          print(f"finops_decision={decision}")
          print(f"deployment_authorization={auth}")
          if auth != "AUTHORIZED":
              sys.exit(
                  f"::error title=Deployment not authorized::Stack {stack!r} is not "
                  f"authorized to deploy (finops_decision={decision}, "
                  f"deployment_authorization={auth})."
              )
          PY

      # Independent re-check against config/finops-stacks.yml on the trusted
      # ref. A stack marked deployable=false can never be applied, whatever the
      # gate reported.
      - name: Verify the stack is deployable (trusted registry)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import yaml

          name = os.environ["DEPLOY_STACK"]
          registry = yaml.safe_load(open("config/finops-stacks.yml", encoding="utf-8"))
          stack = (registry.get("stacks") or {}).get(name)
          if stack is None:
              sys.exit(f"::error title=Unknown stack::{name!r} is not in the stack registry.")
          if not stack.get("deployable"):
              reason = stack.get("deferred_reason", "marked non-deployable").strip()
              sys.exit(
                  f"::error title=Stack not deployable::Refusing to apply {name!r}. {reason}"
              )
          expected = os.environ["TARGET_ENV"]
          if stack.get("environment") != expected:
              sys.exit(
                  f"::error title=Environment mismatch::{name!r} targets "
                  f"{stack.get('environment')!r}, not {expected!r}."
              )
          print(f"Stack {name!r} is deployable; terraform_dir={stack['terraform_dir']}")
          print(f"state_key={stack['state_key']}")
          PY

      # A single repo-level secret pointing at the dev deploy role (see
      # backend/README.md "Why only two tiers").
      - name: Resolve deploy role for the target environment
        id: role
        env:
          DEV_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$DEV_ROLE" ]; then
            echo "::error title=No deploy role::AWS_DEPLOY_ROLE_ARN is not set."
            exit 1
          fi
          echo "arn=$DEV_ROLE" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}

      # State key and var-file both derive from TARGET_ENV and the matrix
      # stack, resolved by GitHub Actions expressions and validated above -
      # never built from raw shell input. For aws this reproduces the exact
      # prior literals (finops-poc/${TARGET_ENV}/aws/terraform.tfstate,
      # environments/${TARGET_ENV}.tfvars) byte-for-byte, since matrix.stack.dir
      # and matrix.stack.name equal terraform/aws and aws respectively. A stack
      # with no environments/<env>.tfvars (web-platform today) auto-loads its
      # own committed terraform.tfvars instead - never a scenario fixture.
      #
      # Plan to a file first, then apply exactly that plan - the same
      # save-then-apply pattern already used by
      # .github/actions/terraform-apply/action.yml for the backend layer, so
      # the applied changes are always the reviewed ones, never a fresh plan
      # generated at apply time.
      - name: Terraform plan
        id: plan
        working-directory: ${{ matrix.stack.dir }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=finops-poc/${TARGET_ENV}/${{ matrix.stack.name }}/terraform.tfstate" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -backend-config="region=${{ env.AWS_REGION }}"

          VAR_ARG=""
          if [ -f "environments/${TARGET_ENV}.tfvars" ]; then
            VAR_ARG="-var-file=environments/${TARGET_ENV}.tfvars"
          fi
          terraform plan -input=false -no-color -lock-timeout=5m \
            $VAR_ARG \
            -out=tfplan.binary
          terraform show -json tfplan.binary > plan.json

          DESTROY=$(python3 -c "import json;d=json.load(open('plan.json'));print(sum(1 for c in d.get('resource_changes',[]) if 'delete' in c['change']['actions']))")
          echo "destroy_count=$DESTROY" >> "$GITHUB_OUTPUT"
          echo "Resources to destroy: $DESTROY"

      # 'delete' in a resource's actions covers both a pure destroy
      # (actions: ["delete"]) and a destructive replace (actions:
      # ["delete","create"] / ["create","delete"]), so this single check
      # blocks both. A workload deploy should never delete infrastructure
      # outside a deliberate, human-reviewed change - fail closed instead.
      - name: Block destructive apply
        if: steps.plan.outputs.destroy_count != '0'
        run: |
          echo "::error title=Destructive apply blocked::Plan would destroy ${{ steps.plan.outputs.destroy_count }} resource(s) in $TARGET_ENV. Apply aborted. Review the plan and apply manually if this is intended."
          exit 1

      - name: Terraform apply
        working-directory: ${{ matrix.stack.dir }}
        run: |
          set -euo pipefail
          terraform apply -input=false -no-color -lock-timeout=5m tfplan.binary
