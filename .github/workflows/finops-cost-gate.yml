name: FinOps Cost Gate

# Shift-left FinOps control:
#   detect IaC change -> terraform plan (base + head) -> Infracost -> threshold
#   -> PASS (lock cost, continue) | FAIL (block, require peer review)

# Quoted because YAML 1.1 resolves a bare `on` key to boolean true.
"on":
  pull_request:
    paths:
      - 'terraform/**'
      - 'config/finops-policy.yaml'
      - 'finops-exceptions/**'
      - '.github/workflows/finops-cost-gate.yml'
  # Trusted post-merge execution. The PR gate runs PR-branch code, so its cost
  # lock is audit evidence only - never an authorisation. This push run re-runs
  # the whole gate from trusted main code, mints a fresh lock, verifies it, and
  # only then deploys to dev.
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'config/finops-policy.yaml'
      - 'finops-exceptions/**'
      - '.github/workflows/finops-cost-gate.yml'
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud stack to evaluate
        required: true
        default: aws
        type: choice
        options: [aws, azure, gcp]
      deploy:
        description: "Apply the stack after the gate passes (leave unchecked to only evaluate cost)"
        required: false
        default: false
        type: boolean
      deploy_environment:
        description: Environment to deploy to when 'deploy' is checked
        required: false
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required for AWS OIDC

env:
  PYTHON_VERSION: '3.12'
  TERRAFORM_VERSION: '1.11.0'
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    name: Detect infrastructure changes
    runs-on: ubuntu-latest
    outputs:
      has_infra_changes: ${{ steps.detect.outputs.has_infra_changes }}
      clouds: ${{ steps.detect.outputs.clouds }}
      aws_evaluated: ${{ steps.detect.outputs.aws_evaluated }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install engine
        run: pip install --quiet -e .

      - name: Detect
        id: detect
        run: |
          set -euo pipefail
          # On push, main is both base and head, so diffing against the branch
          # would report no change. Use the pre-push commit to see what the
          # merge actually introduced.
          BASE="${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}"

          finops detect-changes --base "$BASE" --head HEAD --json > changes.json
          cat changes.json

          HAS=$(python -c "import json;print(str(json.load(open('changes.json'))['has_infrastructure_changes']).lower())")
          echo "has_infra_changes=$HAS" >> "$GITHUB_OUTPUT"

          # Only evaluate stacks the PR actually touched.
          CLOUDS=$(python - <<'PY'
          import json
          files = json.load(open('changes.json'))['infrastructure_files']
          found = [c for c in ('aws', 'azure', 'gcp') if any(f'terraform/{c}/' in f for f in files)]
          print(json.dumps(found or ['aws']))
          PY
          )
          echo "clouds=$CLOUDS" >> "$GITHUB_OUTPUT"
          echo "Detected clouds: $CLOUDS"

          # Deployment is AWS-only in this POC, but the gate runs per detected
          # cloud. Without this the deploy job would apply terraform/aws after
          # an Azure-only push that never priced AWS at all.
          AWS_EVAL=$(CLOUDS="$CLOUDS" python -c "import json,os;print('true' if 'aws' in json.loads(os.environ['CLOUDS']) else 'false')")
          echo "aws_evaluated=$AWS_EVAL" >> "$GITHUB_OUTPUT"
          echo "AWS evaluated by the gate: $AWS_EVAL"

  cost-gate:
    name: Cost gate (${{ matrix.cloud }})
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.has_infra_changes == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.cloud)) || fromJSON(needs.detect-changes.outputs.clouds) }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.event.before || github.base_ref || github.event.repository.default_branch }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          # Pinned - both the runner and parser are verified against this
          # exact version. Do not float; an untested minor/major bump could
          # silently change command syntax or output schema.
          version: "0.10.45"

      - name: Install engine
        working-directory: head
        run: pip install --quiet -e '.[bedrock]'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Both plans use the committed terraform.tfvars, which Terraform loads
      # automatically. The cost difference therefore comes purely from what the
      # pull request changed.
      #
      # The cost gate must never read, write or lock any live workload state
      # (dev's or prod's). `init -backend=false` cannot achieve that: it
      # records no backend at all, so the following `plan` re-reads the
      # `backend "s3"` block in main.tf and fails with "Backend
      # initialization required" (reproduced in CI and a clean checkout).
      #
      # Instead each step writes a local-backend override into its own
      # throwaway base/ or head/ checkout. Terraform then plans against an
      # ephemeral local state: no S3 call, no .tflock, no live state access.
      # Infracost prices the plan's *planned end state*, so pricing stays
      # correct and reproducible from empty state every run.
      #
      # This file is generated at runtime and never committed. It must NOT be
      # copied into the deploy job - a `backend "local"` block there makes
      # every S3 -backend-config argument invalid and breaks deployment.
      - name: Terraform plan (base branch = baseline cost)
        id: baseline
        continue-on-error: true
        working-directory: base/terraform/${{ matrix.cloud }}
        run: |
          set -euo pipefail
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > "$GITHUB_WORKSPACE/baseline-plan.json"

      - name: Terraform plan (PR head = proposed cost)
        working-directory: head/terraform/${{ matrix.cloud }}
        run: |
          set -euo pipefail
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > "$GITHUB_WORKSPACE/proposed-plan.json"

      # The gate prices the auto-loaded terraform.tfvars, but a dev deploy
      # applies environments/dev.tfvars on top of it. Nothing otherwise forces
      # those to agree, so the pipeline could approve one configuration and
      # ship another. Both plans here are hermetic (empty local state), so the
      # comparison is state-independent; the stateful deploy plan is
      # deliberately NOT used, because its create/update actions legitimately
      # differ once dev already exists.
      #
      # The resolved `variables` block is authoritative. A resource-level
      # fingerprint cannot see provider region: main.tf sets `region =
      # var.region`, so the plan records a reference rather than a
      # constant_value and the normalizer resolves region to null on both
      # sides - a us-east-1 vs eu-west-1 swap produced byte-identical
      # fingerprints when measured. The fingerprint is kept as a second,
      # narrower check on the resources themselves.
      - name: Assert cost-gated config matches the Dev deploy config
        if: matrix.cloud == 'aws'
        working-directory: head/terraform/aws
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -refresh=false \
            -var-file=environments/dev.tfvars -out=devcfg.tfplan
          terraform show -json devcfg.tfplan > "$GITHUB_WORKSPACE/dev-config-plan.json"
          python - <<'PY'
          import json
          import os
          import sys
          from finops.plan.normalizer import normalize_plan_file

          REQUIRED = (
              "region", "ami_id", "instance_type", "instance_count",
              "root_volume_size_gb", "data_volume_size_gb", "data_volume_count",
              "enable_nat_gateway", "environment", "service",
          )
          ABSENT = object()
          ws = os.environ["GITHUB_WORKSPACE"]
          failed = False

          def resolved_vars(path):
              with open(path, encoding="utf-8") as fh:
                  block = json.load(fh).get("variables")
              if not block:
                  print("::error title=Configuration drift::" + path
                        + " exposes no resolved variables; cannot prove the gated config matches Dev.")
                  sys.exit(1)
              return {name: item.get("value") for name, item in block.items()}

          gated = resolved_vars(ws + "/proposed-plan.json")
          deployed = resolved_vars(ws + "/dev-config-plan.json")

          missing = sorted(n for n in REQUIRED if n not in gated or n not in deployed)
          if missing:
              print("::error title=Configuration drift::Required variables absent from a plan: "
                    + ", ".join(missing))
              failed = True

          print("%-22s %-26s %-26s" % ("variable", "cost-gated", "dev deploy"))
          for name in sorted(set(gated) | set(deployed)):
              a = gated.get(name, ABSENT)
              b = deployed.get(name, ABSENT)
              fa = "<absent>" if a is ABSENT else json.dumps(a)
              fb = "<absent>" if b is ABSENT else json.dumps(b)
              drift = a is ABSENT or b is ABSENT or a != b
              print("%-22s %-26s %-26s%s" % (name, fa, fb, "  <-- DRIFT" if drift else ""))
              if drift:
                  failed = True

          gfp = normalize_plan_file(ws + "/proposed-plan.json").fingerprint()
          dfp = normalize_plan_file(ws + "/dev-config-plan.json").fingerprint()
          print("")
          print("resource fingerprint  cost-gated : " + gfp)
          print("resource fingerprint  dev deploy : " + dfp)
          if gfp != dfp:
              print("::error title=Configuration drift::Resource fingerprints differ.")
              failed = True

          if failed:
              print("::error title=Configuration drift::The configuration priced by the cost "
                    "gate is not the configuration Dev would deploy. Refusing to approve one "
                    "configuration and deploy another.")
              sys.exit(1)
          print("Cost-gated configuration matches the Dev deployment configuration.")
          PY

      - name: FinOps cost gate
        id: gate
        working-directory: head
        continue-on-error: true
        env:
          # Infracost CLI v2 reads this; v0.10 reads INFRACOST_API_KEY.
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          FINOPS_THRESHOLD_VALUE: ${{ vars.FINOPS_THRESHOLD_VALUE || '100' }}
          FINOPS_THRESHOLD_METRIC: ${{ vars.FINOPS_THRESHOLD_METRIC || 'incremental_monthly_cost' }}
          # Bedrock uses the OIDC role already assumed above - no extra key.
          FINOPS_AI_PROVIDER: bedrock
          FINOPS_BEDROCK_MODEL: ${{ vars.FINOPS_BEDROCK_MODEL || 'us.anthropic.claude-haiku-4-5-20251001-v1:0' }}
          FINOPS_BEDROCK_REGION: ${{ env.AWS_REGION }}
        run: |
          set +e
          BASELINE_ARG=""
          if [ -f "$GITHUB_WORKSPACE/baseline-plan.json" ]; then
            BASELINE_ARG="--baseline-plan $GITHUB_WORKSPACE/baseline-plan.json"
          else
            echo "::warning::No baseline plan; incremental cost equals full projected cost."
          fi

          finops analyze \
            --plan "$GITHUB_WORKSPACE/proposed-plan.json" \
            $BASELINE_ARG \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --execution-id "${{ github.run_id }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # An over-threshold change may proceed only with an audited, peer-approved
      # exception. The FinOps decision stays FAIL either way - this decides
      # whether that specific overspend was explicitly accepted for this exact
      # change. Authorisation comes from the live GitHub reviews API, never from
      # repository content, so a pull request cannot approve itself.
      - name: Evaluate budget exception
        id: exception
        if: steps.gate.outputs.exit_code == '1'
        working-directory: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          FINOPS_APPROVERS: ${{ vars.FINOPS_APPROVERS }}
        run: |
          set -euo pipefail
          echo "valid=false" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "pull_request" ]; then
            PR="$PR_EVENT_NUMBER"; HEAD_SHA="$PR_EVENT_HEAD"; AUTHOR="$PR_EVENT_AUTHOR"
          else
            gh api "repos/$REPO/commits/$SHA/pulls" > pr.json
            PR=$(python3 -c "import json;d=json.load(open('pr.json'));print(d[0]['number'] if d else '')")
            HEAD_SHA=$(python3 -c "import json;d=json.load(open('pr.json'));print(d[0]['head']['sha'] if d else '')")
            AUTHOR=$(python3 -c "import json;d=json.load(open('pr.json'));print(d[0]['user']['login'] if d else '')")
          fi

          if [ -z "$PR" ]; then
            echo "::error title=No pull request::Cannot authorise a budget exception without an associated pull request."
            exit 1
          fi

          RECORD="finops-exceptions/pr-${PR}.json"
          if [ ! -f "$RECORD" ]; then
            echo "::notice title=FINOPS BLOCKED::No budget exception found at $RECORD. Peer approval is required."
            exit 0
          fi

          gh api "repos/$REPO/pulls/${PR}/reviews" --paginate > reviews.json

          set +e
          finops verify-exception \
            --exception "$RECORD" \
            --plan "$GITHUB_WORKSPACE/proposed-plan.json" \
            --estimate .finops/cost-estimate.json \
            --pr "$PR" \
            --head-sha "$HEAD_SHA" \
            --pr-author "$AUTHOR" \
            --reviews reviews.json \
            --verified-commit "$SHA"
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=FINOPS BLOCKED::The budget exception does not authorise this change."
          fi

      - name: Publish gate summary
        if: always()
        working-directory: head
        run: |
          if [ -f .finops/pr-comment.md ]; then
            cat .finops/pr-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'head/.finops/pr-comment.md';
            if (!fs.existsSync(path)) return;

            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- finops-cost-gate -->';
            const tag = `${marker}\n<!-- cloud:${{ matrix.cloud }} -->`;
            const scoped = body.replace(marker, tag);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(`<!-- cloud:${{ matrix.cloud }} -->`));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: scoped,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: scoped,
              });
            }

      - name: Upload FinOps artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finops-${{ matrix.cloud }}-${{ github.run_id }}
          path: head/.finops/
          retention-days: 90
          # .finops is dot-prefixed, and upload-artifact@v4 skips hidden paths
          # by default, which silently discarded the whole audit trail.
          include-hidden-files: true

      # Only meaningful on the trusted main run: proves the lock this run just
      # minted is untampered, APPROVED, produced by an AUTHORITATIVE estimator,
      # and still bound to the current threshold and plan before anything is
      # applied. Guarded on a passing gate so a threshold failure reports the
      # real reason rather than a missing-lock error.
      - name: Verify cost lock before deployment
        if: github.event_name == 'push' && steps.gate.outputs.exit_code == '0'
        working-directory: head
        run: |
          set -euo pipefail
          finops verify-lock \
            --lock .finops/cost-lock.json \
            --plan "$GITHUB_WORKSPACE/proposed-plan.json"

      # The gate is the last word: a non-zero exit stops the pipeline.
      #   1 = threshold exceeded, peer approval required (unless an approved
      #       budget exception authorises this exact change)
      #   2 = cost could not be trusted, failing safe
      - name: Enforce gate
        if: always()
        env:
          EXCEPTION_VALID: ${{ steps.exception.outputs.valid }}
        run: |
          CODE="${{ steps.gate.outputs.exit_code }}"
          case "$CODE" in
            0) echo "PASS - cost locked, pipeline may continue." ;;
            1)
              if [ "$EXCEPTION_VALID" = "true" ]; then
                echo "FINOPS: BLOCKED (finops_decision=FAIL)"
                echo "exception_approval=APPROVED - the overspend was explicitly accepted"
                echo "by a peer for this exact change. The FinOps decision is unchanged."
              else
                echo "::error::FinOps threshold exceeded. Peer approval required before merging."
                exit 1
              fi
              ;;
            *) echo "::error::Cost could not be established. Failing safe (exit $CODE)."; exit 1 ;;
          esac

  # Apply is NEVER reachable from a pull request - PR branches run untrusted
  # code, and `terraform apply` on untrusted code is arbitrary code execution
  # against AWS. Two mutually exclusive paths reach here:
  #   push to main    -> automatic, hard-pinned to dev, trusted code only
  #   workflow_dispatch -> explicit opt-in, may target dev or prod
  # Both additionally require that AWS itself was the stack the gate priced -
  # this job applies terraform/aws, so an Azure-only or GCP-only evaluation
  # must not reach it. Apply also targets an environment-specific workload
  # state and var-file, so dev and prod are genuinely isolated - not just
  # IAM-role-labelled copies of the same shared state.
  deploy:
    name: Deploy (gated)
    needs: [detect-changes, cost-gate]
    if: |
      needs.cost-gate.result == 'success' && (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/main' &&
         needs.detect-changes.outputs.aws_evaluated == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.deploy == true &&
         inputs.cloud == 'aws')
      )
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'push' && 'dev') || (inputs.deploy_environment == 'prod' && 'production') || 'dev' }}
    env:
      # Resolved by a GitHub Actions expression, not shell interpolation. On
      # push this is the literal 'dev' and inputs.* is never read, so the
      # automatic path cannot resolve to prod even if an input were forged.
      TARGET_ENV: ${{ (github.event_name == 'push' && 'dev') || inputs.deploy_environment }}
      GATED_CLOUD: ${{ (github.event_name == 'workflow_dispatch' && inputs.cloud) || (needs.detect-changes.outputs.aws_evaluated == 'true' && 'aws') || 'none' }}
    steps:
      - name: Pin and validate deployment target
        run: |
          set -euo pipefail
          if [ "$GATED_CLOUD" != "aws" ]; then
            echo "::error title=Ungated cloud::This job applies terraform/aws, but the FinOps gate evaluated '$GATED_CLOUD'. Refusing to deploy a stack that was not cost-gated."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$TARGET_ENV" != "dev" ]; then
            echo "::error title=Environment pin violated::Automatic push deployments are restricted to dev (got '$TARGET_ENV')."
            exit 1
          fi
          case "$TARGET_ENV" in
            dev|prod) echo "Deploying aws to $TARGET_ENV" ;;
            *) echo "::error title=Invalid environment::TARGET_ENV must be dev or prod (got '$TARGET_ENV')."; exit 1 ;;
          esac

      # The deploy role is a single repo-level secret pointing at ONE
      # environment's role (see backend/README.md "Why only two tiers").
      # Applying prod with it would silently use dev's identity, so prod
      # requires an explicit prod-specific secret instead of falling back.
      - name: Resolve deploy role for the target environment
        id: role
        env:
          DEV_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          PROD_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = "prod" ]; then
            if [ -z "$PROD_ROLE" ]; then
              echo "::error title=No production deploy role::AWS_DEPLOY_ROLE_ARN_PROD is not set. Refusing to deploy prod with dev's role. Apply backend/environments/prod first, then set that secret."
              exit 1
            fi
            echo "arn=$PROD_ROLE" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$DEV_ROLE" ]; then
              echo "::error title=No deploy role::AWS_DEPLOY_ROLE_ARN is not set."
              exit 1
            fi
            echo "arn=$DEV_ROLE" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}

      # State key and var-file both derive from TARGET_ENV, which is resolved
      # by a GitHub Actions expression and validated above - not built from
      # raw shell input. terraform.tfvars in this directory is the committed
      # cost-gate baseline only; it is never passed as -var-file for a deploy,
      # and the explicit -var-file below sets every variable that file also
      # sets, so its auto-loaded values are always overridden.
      #
      # Plan to a file first, then apply exactly that plan - the same
      # save-then-apply pattern already used by
      # .github/actions/terraform-apply/action.yml for the backend layer, so
      # the applied changes are always the reviewed ones, never a fresh plan
      # generated at apply time.
      - name: Terraform plan
        id: plan
        working-directory: terraform/aws
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=finops-poc/${TARGET_ENV}/aws/terraform.tfstate" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file="environments/${TARGET_ENV}.tfvars" \
            -out=tfplan.binary
          terraform show -json tfplan.binary > plan.json

          DESTROY=$(python3 -c "import json;d=json.load(open('plan.json'));print(sum(1 for c in d.get('resource_changes',[]) if 'delete' in c['change']['actions']))")
          echo "destroy_count=$DESTROY" >> "$GITHUB_OUTPUT"
          echo "Resources to destroy: $DESTROY"

      # 'delete' in a resource's actions covers both a pure destroy
      # (actions: ["delete"]) and a destructive replace (actions:
      # ["delete","create"] / ["create","delete"]), so this single check
      # blocks both. A workload deploy should never delete infrastructure
      # outside a deliberate, human-reviewed change - fail closed instead.
      - name: Block destructive apply
        if: steps.plan.outputs.destroy_count != '0'
        run: |
          echo "::error title=Destructive apply blocked::Plan would destroy ${{ steps.plan.outputs.destroy_count }} resource(s) in $TARGET_ENV. Apply aborted. Review the plan and apply manually if this is intended."
          exit 1

      - name: Terraform apply
        working-directory: terraform/aws
        run: |
          set -euo pipefail
          terraform apply -input=false -no-color -lock-timeout=5m tfplan.binary
