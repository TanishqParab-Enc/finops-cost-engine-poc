name: FinOps Cost Gate

# Shift-left FinOps control:
#   detect IaC change -> terraform plan (base + head) -> Infracost -> threshold
#   -> PASS (lock cost, continue) | FAIL (block, require peer review)

# Quoted because YAML 1.1 resolves a bare `on` key to boolean true.
"on":
  pull_request:
    paths:
      - 'terraform/**'
      - 'config/finops-policy.yaml'
      - '.github/workflows/finops-cost-gate.yml'
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud stack to evaluate
        required: true
        default: aws
        type: choice
        options: [aws, azure, gcp]
      deploy:
        description: "Apply the stack after the gate passes (leave unchecked to only evaluate cost)"
        required: false
        default: false
        type: boolean
      deploy_environment:
        description: Environment to deploy to when 'deploy' is checked
        required: false
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required for AWS OIDC

env:
  PYTHON_VERSION: '3.12'
  TERRAFORM_VERSION: '1.11.0'
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    name: Detect infrastructure changes
    runs-on: ubuntu-latest
    outputs:
      has_infra_changes: ${{ steps.detect.outputs.has_infra_changes }}
      clouds: ${{ steps.detect.outputs.clouds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install engine
        run: pip install --quiet -e .

      - name: Detect
        id: detect
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref || github.event.repository.default_branch }}"

          finops detect-changes --base "$BASE" --head HEAD --json > changes.json
          cat changes.json

          HAS=$(python -c "import json;print(str(json.load(open('changes.json'))['has_infrastructure_changes']).lower())")
          echo "has_infra_changes=$HAS" >> "$GITHUB_OUTPUT"

          # Only evaluate stacks the PR actually touched.
          CLOUDS=$(python - <<'PY'
          import json
          files = json.load(open('changes.json'))['infrastructure_files']
          found = [c for c in ('aws', 'azure', 'gcp') if any(f'terraform/{c}/' in f for f in files)]
          print(json.dumps(found or ['aws']))
          PY
          )
          echo "clouds=$CLOUDS" >> "$GITHUB_OUTPUT"
          echo "Detected clouds: $CLOUDS"

  cost-gate:
    name: Cost gate (${{ matrix.cloud }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has_infra_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.cloud)) || fromJSON(needs.detect-changes.outputs.clouds) }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: head

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Install engine
        working-directory: head
        run: pip install --quiet -e '.[bedrock]'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Both plans use the committed terraform.tfvars, which Terraform loads
      # automatically. The cost difference therefore comes purely from what the
      # pull request changed.
      - name: Terraform plan (base branch = baseline cost)
        id: baseline
        continue-on-error: true
        working-directory: base/terraform/${{ matrix.cloud }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=finops-poc/${{ matrix.cloud }}/terraform.tfstate" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform plan -input=false -no-color -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > "$GITHUB_WORKSPACE/baseline-plan.json"

      - name: Terraform plan (PR head = proposed cost)
        working-directory: head/terraform/${{ matrix.cloud }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=finops-poc/${{ matrix.cloud }}/terraform.tfstate" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform plan -input=false -no-color -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > "$GITHUB_WORKSPACE/proposed-plan.json"

      - name: FinOps cost gate
        id: gate
        working-directory: head
        continue-on-error: true
        env:
          # Infracost CLI v2 reads this; v0.10 reads INFRACOST_API_KEY.
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          FINOPS_THRESHOLD_VALUE: ${{ vars.FINOPS_THRESHOLD_VALUE || '100' }}
          FINOPS_THRESHOLD_METRIC: ${{ vars.FINOPS_THRESHOLD_METRIC || 'incremental_monthly_cost' }}
          # Bedrock uses the OIDC role already assumed above - no extra key.
          FINOPS_AI_PROVIDER: bedrock
          FINOPS_BEDROCK_MODEL: ${{ vars.FINOPS_BEDROCK_MODEL || 'us.anthropic.claude-haiku-4-5-20251001-v1:0' }}
          FINOPS_BEDROCK_REGION: ${{ env.AWS_REGION }}
        run: |
          set +e
          BASELINE_ARG=""
          if [ -f "$GITHUB_WORKSPACE/baseline-plan.json" ]; then
            BASELINE_ARG="--baseline-plan $GITHUB_WORKSPACE/baseline-plan.json"
          else
            echo "::warning::No baseline plan; incremental cost equals full projected cost."
          fi

          finops analyze \
            --plan "$GITHUB_WORKSPACE/proposed-plan.json" \
            $BASELINE_ARG \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --execution-id "${{ github.run_id }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish gate summary
        if: always()
        working-directory: head
        run: |
          if [ -f .finops/pr-comment.md ]; then
            cat .finops/pr-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'head/.finops/pr-comment.md';
            if (!fs.existsSync(path)) return;

            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- finops-cost-gate -->';
            const tag = `${marker}\n<!-- cloud:${{ matrix.cloud }} -->`;
            const scoped = body.replace(marker, tag);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(`<!-- cloud:${{ matrix.cloud }} -->`));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: scoped,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: scoped,
              });
            }

      - name: Upload FinOps artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finops-${{ matrix.cloud }}-${{ github.run_id }}
          path: head/.finops/
          retention-days: 90

      # The gate is the last word: a non-zero exit stops the pipeline.
      #   1 = threshold exceeded, peer review required
      #   2 = cost could not be trusted, failing safe
      - name: Enforce gate
        if: always()
        run: |
          CODE="${{ steps.gate.outputs.exit_code }}"
          case "$CODE" in
            0) echo "PASS - cost locked, pipeline may continue." ;;
            1) echo "::error::FinOps threshold exceeded. Peer review required before merging."; exit 1 ;;
            *) echo "::error::Cost could not be established. Failing safe (exit $CODE)."; exit 1 ;;
          esac

  # Apply is NEVER reachable from a pull request. Until 2026-09-03 this job had
  # no event guard, so any PR whose cost gate passed would have run a real
  # `terraform apply -auto-approve` from the PR branch's code.
  deploy:
    name: Deploy (gated)
    needs: [detect-changes, cost-gate]
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true &&
      needs.cost-gate.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deploy_environment == 'prod' && 'production' || 'dev' }}
    steps:
      # The deploy role is a single repo-level secret pointing at ONE
      # environment's role (see backend/README.md "Why only two tiers").
      # Applying prod with it would silently use dev's identity, so prod
      # requires an explicit prod-specific secret instead of falling back.
      - name: Resolve deploy role for the target environment
        id: role
        env:
          DEV_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          PROD_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          TARGET: ${{ inputs.deploy_environment }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "prod" ]; then
            if [ -z "$PROD_ROLE" ]; then
              echo "::error title=No production deploy role::AWS_DEPLOY_ROLE_ARN_PROD is not set. Refusing to deploy prod with dev's role. Apply backend/environments/prod first, then set that secret."
              exit 1
            fi
            echo "arn=$PROD_ROLE" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$DEV_ROLE" ]; then
              echo "::error title=No deploy role::AWS_DEPLOY_ROLE_ARN is not set."
              exit 1
            fi
            echo "arn=$DEV_ROLE" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform apply
        working-directory: terraform/aws
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=finops-poc/aws/terraform.tfstate" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform apply -input=false -no-color -auto-approve
