name: Backend Terraform Plan

# Plan only. This workflow NEVER runs `terraform apply`.
# The AWS role it assumes is the read-only plan role, so apply is not just
# omitted from the YAML - it is impossible with these credentials.

# Quoted because YAML 1.1 resolves a bare `on` key to boolean true.
"on":
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-plan.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TERRAFORM_VERSION: '1.11.0'
  AWS_REGION: us-east-1

concurrency:
  group: backend-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt and validate need no cloud credentials, so fail fast here before
  # assuming any AWS role.
  static-checks:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: backend
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (all layers)
        working-directory: backend
        run: |
          set -euo pipefail
          for dir in bootstrap environments/dev environments/staging environments/prod github; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  plan:
    name: Plan (${{ matrix.environment }})
    needs: static-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev","staging","prod"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Read-only role. It cannot apply even if something tried to.
      - name: Configure AWS credentials (plan role, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backend-plan-${{ matrix.environment }}-${{ github.run_id }}

      - name: Terraform init
        working-directory: backend/environments/${{ matrix.environment }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY_PREFIX || 'finops-poc' }}/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # tfvars are not committed (they would be environment-specific config in
      # source control), so CI renders them from repository variables.
      - name: Render terraform.tfvars
        working-directory: backend/environments/${{ matrix.environment }}
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          cat > terraform.tfvars <<EOF
          project_name = "${{ vars.PROJECT_NAME || 'finops-poc' }}"
          environment  = "${ENVIRONMENT}"
          aws_region   = "${{ env.AWS_REGION }}"

          github_owner      = "${{ github.repository_owner }}"
          github_repository = "${{ github.event.repository.name }}"

          github_environment_name = "${ENVIRONMENT}"

          state_bucket_name = "${{ vars.TF_STATE_BUCKET }}"

          create_oidc_provider       = false
          existing_oidc_provider_arn = "${{ vars.AWS_OIDC_PROVIDER_ARN }}"

          enable_bedrock_access         = true
          bedrock_model_id              = "${{ vars.FINOPS_BEDROCK_MODEL }}"
          bedrock_inference_profile_arn = "${{ vars.BEDROCK_INFERENCE_PROFILE_ARN }}"
          bedrock_foundation_model_arns = ${{ vars.BEDROCK_FOUNDATION_MODEL_ARNS }}
          EOF
          echo "::group::rendered tfvars"
          cat terraform.tfvars
          echo "::endgroup::"

      - name: Terraform plan
        id: plan
        working-directory: backend/environments/${{ matrix.environment }}
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file=terraform.tfvars -out=tfplan.binary | tee plan.txt

          terraform show -no-color tfplan.binary > plan-full.txt
          terraform show -json tfplan.binary > plan.json

          # Surface destroys explicitly - they are the dangerous case.
          DESTROY=$(python3 -c "import json;d=json.load(open('plan.json'));print(sum(1 for c in d.get('resource_changes',[]) if 'delete' in c['change']['actions']))")
          echo "destroy_count=$DESTROY" >> "$GITHUB_OUTPUT"
          echo "Resources to destroy: $DESTROY"

      - name: Flag destructive changes
        if: steps.plan.outputs.destroy_count != '0'
        run: |
          echo "::warning title=Destructive plan::${{ matrix.environment }} plan would DESTROY ${{ steps.plan.outputs.destroy_count }} resource(s). Review carefully before merging."

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-plan-${{ matrix.environment }}-${{ github.run_id }}
          path: |
            backend/environments/${{ matrix.environment }}/plan-full.txt
            backend/environments/${{ matrix.environment }}/plan.json
          if-no-files-found: warn
          retention-days: 30

      - name: Comment plan on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          DESTROY_COUNT: ${{ steps.plan.outputs.destroy_count }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const dir = `backend/environments/${env}`;

            let plan = 'Plan did not complete. See the workflow logs.';
            if (fs.existsSync(`${dir}/plan-full.txt`)) {
              plan = fs.readFileSync(`${dir}/plan-full.txt`, 'utf8');
            }

            // GitHub rejects comments over 65536 characters.
            const LIMIT = 60000;
            const truncated = plan.length > LIMIT;
            if (truncated) {
              plan = plan.slice(0, LIMIT) + '\n\n... truncated. Download the artifact for the full plan.';
            }

            const destroys = process.env.DESTROY_COUNT || '0';
            const warning = destroys !== '0'
              ? `\n> [!WARNING]\n> This plan destroys **${destroys}** resource(s).\n`
              : '';

            const marker = `<!-- backend-plan:${env} -->`;
            const body = [
              marker,
              `### Backend Terraform plan — \`${env}\``,
              warning,
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              `<sub>Read-only plan role · run \`${context.runId}\` · commit \`${context.sha.slice(0, 12)}\` · apply happens only on \`main\`</sub>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
