[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-cost-engine"
version = "0.1.0"
description = "Shift-left FinOps cost governance gate for Terraform pull requests (AWS, Azure, GCP)"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
bedrock = [
    "boto3>=1.34",
]

[project.scripts]
finops = "finops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast isolated unit tests",
    "integration: terraform plan -> cost analysis tests",
    "e2e: full gate workflow tests",
]
